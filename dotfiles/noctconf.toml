[bar.default]
capsule_group = []
center = [ "clock", "date" ]
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center" ]
font_family = "JetBrainsMono NF Medium"
font_weight = 400
margin_edge = 5
margin_ends = 10
padding = 10
start = [ "media", "audio_visualizer", "workspaces", "spacer_2", "active_window" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 2560.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 5120.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
telemetry_enabled = true

[theme]
builtin = "Tokyo-Night"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme" ]

[wallpaper.default]
path = "/nix/store/jj3hbndcxk5l0kd8zkmvir6ns3js3z1p-noctalia-5.1.0/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/nix/store/jj3hbndcxk5l0kd8zkmvir6ns3js3z1p-noctalia-5.1.0/share/noctalia/assets/noctalia-wallpaper.png"

[widget.active_window]
max_length = 800

[widget.audio_visualizer]
scale = 1.4000000000000001
width = 60

[widget.control-center]
glyph = "brand-zhihu"
scale = 1.25

[widget.media]
hide_artist = true
hide_when_no_media = true
max_length = 800
min_length = 0
scale = 1.1000000000000001

[widget.network]
scale = 1.1000000000000001
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.volume]
glyph = "volume"
scale = 1.1000000000000001
